<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود | دبیرستان سوره</title>
<meta name="description" content="ورود به حساب کاربری در دبیرستان سوره">
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

<body data-page="ورود">
<a class="skip" href="#main">رفتن به محتوا</a>

<header class="bar">

        <nav aria-label="منوی اصلی" data-menu></nav>
        <div class="acts" data-acts></div>
</header>

<main id="main" class="page">
        <article class="page__in">
                <h1>ورود</h1>
                <form class="auth" data-auth-form="login">
                        <label>نام کاربری یا ایمیل<input name="username" required autocomplete="username" dir="ltr"></label>
                        <label>رمز عبور<input type="password" name="password" required autocomplete="current-password" dir="ltr"></label>

                        <button class="btn" type="submit">ورود</button>
                        <p class="alt">حساب ندارید؟ <a href="./register.html">ثبت‌نام</a></p>
                </form>
        </article>
</main>

<footer class="foot">
        <p class="foot__name" data-cs="site.name">دبیرستان سوره</p>
        <div class="foot__row">
                <span data-cs="footer.note">همه حقوق محفوظ است.</span>
                <span data-foot-address hidden></span>
                <span data-foot-phone dir="ltr" hidden></span>
        </div>
</footer>

<script src="./assets/js/site.js"></script>
