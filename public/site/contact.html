<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تماس با ما | دبیرستان سوره</title>
<meta name="description" content="تماس با دبیرستان سوره">
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

<body data-page="تماس با ما">
<a class="skip" href="#main">رفتن به محتوا</a>

<header class="bar">
        <a class="mark" href="./index.html">دبیرستان سوره</a>
        <nav aria-label="منوی اصلی" data-menu></nav>
        <div class="acts" data-acts></div>
</header>

<main id="main" class="page">
        <article class="page__in">
                <h1 data-cs="contact.title">تماس با ما</h1>
                <p class="prose" data-cs="contact.text"></p>
                <form class="auth" data-contact-form style="margin-top:22px">
                        <label>نام و نام خانوادگی<input name="name" required autocomplete="name"></label>
                        <label>ایمیل (اختیاری)<input type="email" name="email" autocomplete="email" dir="ltr"></label>
                        <label>تلفن (اختیاری)<input name="phone" autocomplete="tel" dir="ltr"></label>
                        <label>موضوع<input name="subject" required></label>
                        <label>متن پیام<textarea name="body" required></textarea></label>
                        <button class="btn" type="submit">ارسال پیام</button>
                </form>
        </article>
</main>

<footer class="foot">
        <p class="foot__name" data-cs="site.name">دبیرستان سوره</p>
        <div class="foot__row">
                <span data-cs="footer.note">همه حقوق محفوظ است.</span>
                <span data-foot-address hidden></span>
                <span data-foot-phone dir="ltr" hidden></span>
        </div>
</footer>

<script src="./assets/js/site.js"></script>
</body>
</html>
