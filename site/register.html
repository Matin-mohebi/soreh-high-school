<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت‌نام | دبیرستان سوره</title>
<meta name="description" content="ساخت حساب کاربری در وب‌سایت دبیرستان سوره">
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css">
<link rel="stylesheet" href="./assets/css/toolkit.css">
<link rel="stylesheet" href="./assets/css/extras.css">
<script>document.documentElement.classList.add('js');try{if(sessionStorage.getItem('cs_gate'))document.documentElement.classList.add('seen')}catch(e){}</script>
</head>
<body data-title="ثبت‌نام">
<a class="skip" href="#main">رفتن به محتوا</a>

<header class="bar">
        <a class="mark" href="./index.html">دبیرستان سوره</a>
        <nav aria-label="منوی اصلی" data-menu></nav>
        <div class="acts" data-acts></div>
</header>

<main id="main" class="page">
        <article class="page__in">
                <h1>ثبت‌نام</h1>
                <form class="auth" data-auth-form="register">
                        <label>نام و نام خانوادگی<input name="name" required autocomplete="name"></label>
                        <label>نام کاربری (انگلیسی)<input name="username" required minlength="3" autocomplete="username" dir="ltr"></label>
                        <label>ایمیل<input type="email" name="email" required autocomplete="email" dir="ltr"></label>
                        <label>رمز عبور (حداقل ۸ کاراکتر)<input type="password" name="password" required minlength="8" autocomplete="new-password" dir="ltr"></label>
                        <button class="btn" type="submit">ثبت‌نام</button>
                        <p class="alt">قبلا ثبت‌نام کرده‌اید؟ <a href="./login.html">ورود</a></p>
                </form>
        </article>
</main>

<footer class="foot">
        <p class="foot__name" data-cs="site.name">دبیرستان سوره</p>
        <div class="foot__row">
                <span data-cs="footer.note">همه حقوق محفوظ است.</span>
                <span data-foot-address hidden></span>
                <span data-foot-phone dir="ltr" hidden></span>
        </div>
</footer>

<script src="./assets/js/site.js"></script>
</body>
</html>
